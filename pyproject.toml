[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fm1-playwright"
version = "0.1.0"
description = "Playwright test harness for FM-1 emulator firmware UI testing"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["playwright"]
readme = "README.md"
keywords = ["fm1", "m-vave", "firmware", "testing", "playwright", "emulator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
patchright = ["patchright"]

[project.urls]
Homepage = "https://github.com/DimmKirr/fm1-playwright"
Repository = "https://github.com/DimmKirr/fm1-playwright"
Issues = "https://github.com/DimmKirr/fm1-playwright/issues"

[[project.authors]]
name = "Dmitry Kireev"

[tool.setuptools.packages.find]
include = ["fm1_playwright*"]
